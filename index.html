
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قَلَم | منصّة الكتابة العربية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#f5f0e8;font-family:Tahoma,Arial,sans-serif}
header{background:#1b1b1b;padding:20px;border-bottom:1px solid #333}
.logo{color:#ff962e;font-size:30px;font-weight:bold}
main{max-width:750px;margin:auto;padding:20px}
h1{line-height:1.7}
p{line-height:2;color:#bbb}
.panel{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:18px;margin:20px 0}
input,textarea,select,button{width:100%;padding:13px;margin-top:12px;border-radius:8px;font:inherit}
input,textarea,select{background:#111;color:white;border:1px solid #444}
textarea{min-height:160px}
button{background:#ff962e;color:#111;border:0;font-weight:bold}
.post{border-bottom:1px solid #444;padding:12px 0;white-space:pre-wrap}
small{color:#ff962e}
</style>
</head>
<body>
<header>
<div class="logo">✒ قَلَم</div>
<p>مساحة لكل فكرة وكلمة</p>
</header>
<main>
<h1>لكل إنسان حكاية، ولكل فكرة قلم.</h1>
<p>اكتب مقالاتك وخواطرك وقصائدك وشارك أفكارك مع القرّاء.</p>

<section class="panel">
<h2>اكتب منشورك</h2>
<form id="form">
<input id="title" placeholder="عنوان الكتابة" required maxlength="200">
<select id="category">
<option>مقالة</option><option>خاطرة</option>
<option>شعر</option><option>قصة</option>
<option>فلسفة</option><option>علم نفس</option>
</select>
<textarea id="content" placeholder="اكتب ما يجول في خاطرك..." required></textarea>
<button type="submit">نشر في هذه الصفحة</button>
</form>
</section>

<section class="panel">
<h2>مساحة القرّاء</h2>
<div id="posts"><p>أهلاً بك في منصّة قَلَم.</p></div>
</section>
</main>
<script>
document.getElementById('form').addEventListener('submit',function(e){
e.preventDefault();
const title=document.getElementById('title').value.trim();
const category=document.getElementById('category').value;
const content=document.getElementById('content').value.trim();
const post=document.createElement('article');
post.className='post';
const h=document.createElement('h3');
h.textContent=title;
const c=document.createElement('small');
c.textContent='التصنيف: '+category;
const p=document.createElement('p');
p.textContent=content;
post.append(h,c,p);
document.getElementById('posts').prepend(post);
this.reset();
});
</script>
</body>
</html>
